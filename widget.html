<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meroño TTS</title>
<style>
:root {
  --panel: rgba(12, 10, 18, .96);
  --panel-soft: rgba(25, 18, 36, .9);
  --purple: #8b5cf6;
  --purple-light: #c4a7ff;
  --purple-dark: #4c1d95;
  --text: #f8f5ff;
  --muted: #a79db5;
  --gold: #ffd76a;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
body { font-family: Inter, "Segoe UI", Arial, sans-serif; }
#tts-root { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2147483000; pointer-events: none; background: transparent; }
.bubble {
  position: absolute;
  left: 34px;
  bottom: 34px;
  display: flex;
  align-items: center;
  gap: 16px;
  max-width: min(720px, calc(100vw - 68px));
  padding: 14px;
  color: var(--text);
  background: var(--panel);
  border: 1px solid transparent;
  border-radius: 24px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, .55), 0 0 28px rgba(139, 92, 246, .18);
  opacity: 0;
  visibility: hidden;
  transform: translateY(18px) scale(.97);
  transition: opacity .32s ease, transform .32s cubic-bezier(.16, 1, .3, 1), visibility .32s;
  overflow: hidden;
}
.bubble::before {
  content: "";
  position: absolute;
  inset: 0;
  padding: 1px;
  border-radius: inherit;
  background: linear-gradient(120deg, #d8c4ff 0%, var(--purple) 30%, #5b21b6 55%, #e9ddff 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}
.bubble::after {
  content: "";
  position: absolute;
  top: -70%;
  left: -25%;
  width: 60%;
  height: 220%;
  background: linear-gradient(105deg, transparent, rgba(255,255,255,.08), transparent);
  transform: rotate(18deg);
  pointer-events: none;
}
.bubble.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.avatar {
  width: 104px;
  height: 104px;
  flex: 0 0 104px;
  object-fit: cover;
  border: 2px solid rgba(196, 167, 255, .82);
  border-radius: 18px;
  background: #17111f;
  box-shadow: 0 0 18px rgba(139, 92, 246, .28);
}
.avatar.hidden { display: none; }
.body { min-width: 0; max-width: 570px; padding: 4px 12px 4px 2px; }
.header { display: flex; align-items: center; gap: 12px; min-height: 28px; }
.username { max-width: 390px; overflow: hidden; color: var(--purple-light); font-size: 23px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
.bits { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; color: var(--gold); background: rgba(255, 215, 106, .1); border: 1px solid rgba(255, 215, 106, .18); border-radius: 999px; font-size: 17px; font-weight: 750; white-space: nowrap; }
.message { max-width: 570px; margin-top: 9px; color: var(--text); font-size: 22px; line-height: 1.35; overflow-wrap: anywhere; }
.wave { display: flex; align-items: center; gap: 4px; height: 20px; margin-top: 10px; opacity: .35; }
.bubble[data-state="speaking"] .wave { opacity: 1; }
.bar { width: 4px; height: 8px; border-radius: 4px; background: linear-gradient(180deg, var(--purple-light), var(--purple)); animation: wave .75s ease-in-out infinite; }
.bar:nth-child(1) { height: 8px; animation-delay: -.4s; }
.bar:nth-child(2) { height: 15px; animation-delay: -.2s; }
.bar:nth-child(3) { height: 20px; animation-delay: -.6s; }
.bar:nth-child(4) { height: 12px; animation-delay: -.1s; }
.bar:nth-child(5) { height: 17px; animation-delay: -.5s; }
@keyframes wave { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1.2); } }
.bubble[data-state="error"] { border-color: rgba(255, 105, 145, .8); }
.bubble[data-state="error"] .message { color: #ffc0d0; }
.status { display: none; position: fixed; right: 8px; top: 6px; color: rgba(255,255,255,.32); font: 11px/1.2 monospace; text-shadow: 0 1px 2px #000; }
</style>
</head>
<body>
<div id="tts-root">
  <section class="bubble" id="bubble" data-state="queued">
    <img class="avatar" id="profile-normal" alt="Meroño">
    <img class="avatar hidden" id="profile-chino" alt="Meroño chino">
    <div class="body">
      <div class="header">
        <div class="username" id="username"></div>
        <div class="bits"><span>♦</span><span id="bits">0</span></div>
      </div>
      <div class="message" id="message"></div>
      <div class="wave" aria-hidden="true">
        <i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i>
      </div>
    </div>
  </section>
</div>
<div class="status" id="status">Meroño TTS</div>
<script>
const CONFIG = Object.freeze({
  apiUrl: "https://REEMPLAZA_CON_TU_URL_DE_RENDER",
  widgetToken: "REEMPLAZA_CON_TU_WIDGET_TOKEN",
  channel: "alimentacionchino",
  imageBaseUrl: "https://REEMPLAZA_CON_TU_URL_DE_RENDER",
  minBits: 10,
  maxTextLength: 600,
  keepWarmIntervalMs: 240000,
  dedupTtlMs: 300000,
  gapMs: 450,
  maxQueue: 8,
  fetchTimeoutMs: 90000,
  retryBaseMs: 1000,
  maxRetries: 3
});

const root = document.getElementById("tts-root");
const bubble = document.getElementById("bubble");
const usernameEl = document.getElementById("username");
const messageEl = document.getElementById("message");
const bitsEl = document.getElementById("bits");
const normalEl = document.getElementById("profile-normal");
const chinoEl = document.getElementById("profile-chino");
const statusEl = document.getElementById("status");

function imageUrl(name) {
  return `${String(CONFIG.imageBaseUrl || "").replace(/\/+$/, "")}/images/${name}`;
}

normalEl.src = imageUrl("profile.png");
chinoEl.src = imageUrl("profile_chino.png");

const instanceId = (() => {
  try {
    const key = "merono_tts_instance_v2";
    const current = sessionStorage.getItem(key);
    if (current) return current;
    const value = self.crypto?.randomUUID?.() || Math.random().toString(36).slice(2);
    sessionStorage.setItem(key, value);
    return value;
  } catch { return Math.random().toString(36).slice(2); }
})();
const hanPattern = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;
let liveState = false;
let keepWarmTimer = null;
let eventSeen = readSeenEvents();
let queue = [];
let processing = false;
let audioContext = null;
let currentAudio = null;

function unlockAudio() {
  try {
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    audioContext ||= new Context();
    audioContext.resume().catch(() => {});
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    gain.gain.value = 0;
    oscillator.connect(gain).connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.05);
  } catch (error) {
    log(`AudioContext no disponible: ${error.message}`);
  }
}

function readSeenEvents() {
  try {
    const parsed = JSON.parse(localStorage.getItem("merono_tts_seen_v2") || "{}");
    const now = Date.now();
    return Object.fromEntries(Object.entries(parsed).filter(([, time]) => now - time < CONFIG.dedupTtlMs));
  } catch { return {}; }
}

function saveSeenEvents() {
  try {
    const now = Date.now();
    for (const [key, time] of Object.entries(eventSeen)) if (now - time >= CONFIG.dedupTtlMs) delete eventSeen[key];
    localStorage.setItem("merono_tts_seen_v2", JSON.stringify(eventSeen));
  } catch {}
}

function log(message) {
  console.log(`[Meroño TTS] ${message}`);
  statusEl.textContent = message;
}

function containsChinese(value) {
  return hanPattern.test(String(value || ""));
}

function fallback(username, amount) {
  return `${username || "Anónimo"} dona ${amount || 0} bits.`;
}

function cleanText(value) {
  return String(value || "").replace(/^\s*!tts\b/i, "").replace(/\bcheer\s*\d+\b/gi, "").replace(/\s+/g, " ").trim().slice(0, CONFIG.maxTextLength);
}

function eventKeys(event) {
  const id = event.eventId ? `id:${event.eventId}` : `content:${event.username}:${event.amount}:${event.text}`;
  return [id, `content:${event.username}:${event.amount}:${event.text}`];
}

function isDuplicate(keys) {
  const now = Date.now();
  return keys.some(key => typeof eventSeen[key] === "number" && now - eventSeen[key] < CONFIG.dedupTtlMs);
}

function markSeen(keys) {
  const now = Date.now();
  keys.forEach(key => { eventSeen[key] = now; });
  saveSeenEvents();
}

function unmarkSeen(keys) {
  keys.forEach(key => { delete eventSeen[key]; });
  saveSeenEvents();
}

function parseEvent(raw) {
  if (!raw || (raw.type !== "cheer" && raw.type !== "bits")) return null;
  const data = raw.data || raw;
  const username = String(data.displayName || data.name || data.username || raw.user_name || "Anónimo").slice(0, 80);
  const amount = Number.parseInt(data.amount || raw.amount || raw.bits || 0, 10) || 0;
  const text = cleanText(data.message || raw.message || raw.text || "");
  if (amount < CONFIG.minBits) return null;
  const eventId = String(raw._id || data._id || "");
  return { eventId, username, amount, text: text || fallback(username, amount), keys: eventKeys({ eventId, username, amount, text }) };
}

function showBubble(item, state) {
  root.style.position = "fixed";
  root.style.inset = "0";
  usernameEl.textContent = item.username;
  messageEl.textContent = item.text;
  bitsEl.textContent = Number(item.amount || 0).toLocaleString("es-ES");
  const chinese = containsChinese(item.text);
  normalEl.classList.toggle("hidden", chinese);
  chinoEl.classList.toggle("hidden", !chinese);
  bubble.dataset.state = state;
  bubble.classList.add("show");
}

function hideBubble() {
  bubble.classList.remove("show");
  bubble.dataset.state = "queued";
}

async function requestAudio(item) {
  for (let attempt = 1; attempt <= CONFIG.maxRetries; attempt++) {
    try { log(`Backend: ${new URL(CONFIG.apiUrl).host}`); } catch {}
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), CONFIG.fetchTimeoutMs);
    try {
      const response = await fetch(`${CONFIG.apiUrl}/api/v1/speech`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Widget-Token": CONFIG.widgetToken, "X-Widget-Instance": instanceId },
        body: JSON.stringify({ text: item.text, username: item.username, amount: item.amount, event_id: item.eventId, channel: CONFIG.channel, test: Boolean(item.test) }),
        signal: controller.signal
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        if (response.status === 409) {
          const duplicate = new Error(body.detail || "Evento duplicado");
          duplicate.code = "DUPLICATE";
          duplicate.retryable = false;
          throw duplicate;
        }
        const retryable = response.status === 408 || response.status === 429 || response.status >= 500;
        if (retryable && attempt < CONFIG.maxRetries) { await wait(CONFIG.retryBaseMs * (2 ** (attempt - 1))); continue; }
        const failure = new Error(body.detail || `HTTP ${response.status}`);
        failure.retryable = false;
        throw failure;
      }
      const audio = await response.blob();
      if (audio.size < 100) throw new Error("Audio vacío");
      return audio;
    } catch (error) {
      if ((error && error.retryable === false) || attempt === CONFIG.maxRetries) throw error;
      await wait(CONFIG.retryBaseMs * (2 ** attempt));
    } finally { clearTimeout(timeout); }
  }
  throw new Error("No se pudo sintetizar");
}

function playAudio(blob, item) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.preload = "auto";
    audio.volume = 1;
    currentAudio = audio;
    let settled = false;
    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(safetyTimer);
      audio.pause();
      if (currentAudio === audio) currentAudio = null;
      URL.revokeObjectURL(url);
      resolve();
    };
    const safetyTimer = setTimeout(finish, 180000);
    audio.onended = finish;
    audio.onerror = () => { log(`Audio inválido: ${item.username}`); finish(); };
    audio.onplaying = () => { bubble.dataset.state = "speaking"; log(`Reproduciendo ${item.username}`); };
    const resume = audioContext ? audioContext.resume() : Promise.resolve();
    resume.catch(() => {}).finally(() => {
      audio.load();
      audio.play().then(() => { bubble.dataset.state = "speaking"; }).catch(error => { log(`Audio bloqueado: ${error.message}`); finish(); });
    });
  });
}

async function processQueue() {
  if (processing) return;
  processing = true;
  while (queue.length) {
    const item = queue.shift();
    showBubble(item, "generating");
    try {
      const audio = await requestAudio(item);
      await playAudio(audio, item);
      hideBubble();
    } catch (error) {
      if (error && error.code === "DUPLICATE") {
        log("Duplicado ignorado");
        hideBubble();
      } else {
        log(`Error: ${error.message}`);
        showBubble({ ...item, text: `No se pudo reproducir: ${item.text}` }, "error");
        await wait(2500);
        hideBubble();
        unmarkSeen(item.keys);
      }
    }
    await wait(CONFIG.gapMs);
  }
  processing = false;
}

function enqueue(item) {
  if (queue.length >= CONFIG.maxQueue) return;
  queue.push(item);
  processQueue();
}

function setLiveState(value) {
  liveState = Boolean(value);
  fetch(`${CONFIG.apiUrl}/api/v1/lifecycle`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Widget-Token": CONFIG.widgetToken },
    body: JSON.stringify({ live: liveState })
  }).catch(() => {});
  if (liveState && !keepWarmTimer) {
    keepWarmTimer = setInterval(() => setLiveState(true), CONFIG.keepWarmIntervalMs);
  } else if (!liveState && keepWarmTimer) {
    clearInterval(keepWarmTimer);
    keepWarmTimer = null;
  }
}

function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

function runTest(text = "Este es un mensaje de prueba. Si me ves y me oyes, el bot funciona correctamente.") {
  const item = { eventId: `test:${Date.now()}:${Math.random()}`, username: "Prueba", amount: 100, text: cleanText(text), keys: [], test: true };
  enqueue(item);
}

window.meronoTest = runTest;
unlockAudio();
window.addEventListener("onEventReceived", event => {
  const item = parseEvent(event?.detail?.event);
  if (!item || isDuplicate(item.keys)) return;
  markSeen(item.keys);
  log(`Cheer recibido: ${item.username} (${item.amount})`);
  enqueue(item);
});
window.addEventListener("onSessionChange", event => {
  const detail = event?.detail || {};
  const value = detail.live ?? detail.channel?.live ?? detail.session?.live ?? detail.status;
  if (value === true || value === "live") setLiveState(true);
  else if (value === false || value === "offline") setLiveState(false);
});
if (new URLSearchParams(location.search).has("test")) setTimeout(() => runTest(), 800);
</script>
</body>
</html>
