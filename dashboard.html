<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meroño TTS · Render</title>
<link rel="icon" type="image/png" href="/images/profile.png">
<link rel="shortcut icon" type="image/png" href="/images/profile.png">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#09090b;--panel:#111113;--card:#161618;--soft:#1c1c20;
    --line:#232327;--line-soft:#1c1c20;--text:#e8e8ed;--muted:#8a8a95;
    --dim:#5c5c66;--accent:#a855f7;--accent-2:#c084fc;--accent-3:#7c3aed;
    --green:#22c55e;--red:#ef4444;--blue:#60a5fa;--teal:#34d399;--amber:#fbbf24;
  }
  html,body{min-height:100%}
  body{
    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 420px at 15% -10%,rgba(168,85,247,.10),transparent 60%),
      radial-gradient(700px 380px at 95% 0%,rgba(124,58,237,.08),transparent 55%),
      var(--bg);
    color:var(--text);display:flex;justify-content:center;
    padding:clamp(10px,2vw,30px);
  }
  .app{
    width:100%;max-width:1220px;background:var(--panel);
    border:1px solid var(--line);border-radius:18px;
    padding:clamp(14px,2vw,30px);box-shadow:0 18px 70px rgba(0,0,0,.55);
    display:flex;flex-direction:column;gap:clamp(12px,1.4vw,20px);
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
  .brand{display:flex;flex-direction:column;gap:3px}
  .brand h1{
    font-size:20px;font-weight:650;letter-spacing:-.4px;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  }
  .brand p{font-size:12px;color:var(--dim);letter-spacing:.2px}
  .status-pill{
    display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);
    background:#19191c;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
  }
  .status-pill strong{color:var(--text);font-weight:500}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#52525b}
  .dot.green{background:var(--green);box-shadow:0 0 10px rgba(34,197,94,.5)}
  .dot.red{background:var(--red);box-shadow:0 0 10px rgba(239,68,68,.45)}
  .dot.pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.3vw,18px)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:clamp(14px,1.5vw,20px);display:flex;flex-direction:column;
    transition:border-color .2s,transform .2s;
  }
  .card:hover{border-color:#2c2c32}
  .card:focus-within{border-color:rgba(168,85,247,.35)}
  .card.full{grid-column:1/-1}
  .card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .card-header .icon{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--accent-2);background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.18)}
  .card-header h2{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
  .param{display:grid;grid-template-columns:minmax(110px,1fr) auto;align-items:center;gap:12px;padding:7px 0;border-top:1px solid var(--line-soft)}
  .param:first-of-type{border-top:none}
  .param label{font-size:13px;color:#b4b4bd;display:flex;align-items:center;gap:8px}
  .tag{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--soft);color:var(--dim);font-weight:500}
  .ctrl{display:flex;align-items:center;gap:9px;min-width:0}
  input[type=range]{
    width:clamp(110px,13vw,230px);height:4px;background:#27272c;border:none;border-radius:999px;
    appearance:none;-webkit-appearance:none;outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    appearance:none;-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--accent);cursor:pointer;transition:transform .15s,box-shadow .15s;
    box-shadow:0 0 0 0 rgba(168,85,247,.25);
  }
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.18)}
  input[type=range]:focus::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(168,85,247,.22)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
  .val{font-size:12px;font-weight:600;color:var(--accent-2);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
  select{
    width:clamp(110px,13vw,230px);font-size:12px;padding:6px 8px;background:var(--soft);
    border:1px solid #2a2a30;border-radius:7px;color:var(--text);outline:none;cursor:pointer;
    transition:border-color .2s;
  }
  select:focus{border-color:var(--accent)}
  .toggle{position:relative;width:34px;height:19px;flex-shrink:0;cursor:pointer}
  .toggle input{opacity:0;width:0;height:0;position:absolute}
  .toggle .slider{position:absolute;inset:0;background:#2a2a30;border-radius:999px;transition:.2s}
  .toggle .slider::before{content:'';position:absolute;width:15px;height:15px;border-radius:50%;background:#60606a;top:2px;left:2px;transition:.2s}
  .toggle input:checked+.slider{background:var(--accent)}
  .toggle input:checked+.slider::before{background:#fff;transform:translateX(15px)}
  .model-hint{
    margin-top:12px;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.55;
    background:rgba(168,85,247,.07);border:1px solid rgba(168,85,247,.16);color:#c7c7d1;display:none;
  }
  .model-hint.show{display:block}
  .model-hint code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--accent-2);background:rgba(168,85,247,.12);padding:1px 5px;border-radius:4px}

  .stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  .stat-box{background:var(--soft);border:1px solid var(--line-soft);border-radius:10px;padding:11px 12px;text-align:center;min-width:0}
  .stat-box .num{font-size:18px;font-weight:650;color:var(--accent-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat-box .lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
  .table-wrap{overflow:auto;max-height:230px;border-radius:8px}
  .event-table{width:100%;border-collapse:collapse;font-size:11px;min-width:560px}
  .event-table th{text-align:left;color:var(--dim);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.6px;font-size:9px;position:sticky;top:0;background:var(--card)}
  .event-table td{padding:6px 8px;border-bottom:1px solid var(--line-soft);color:#a5a5af;max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .event-table tr:last-child td{border-bottom:none}
  .event-badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .event-badge.speech{background:rgba(96,165,250,.14);color:var(--blue)}
  .event-badge.cache_hit{background:rgba(52,211,153,.14);color:var(--teal)}
  .event-badge.error{background:rgba(239,68,68,.14);color:var(--red)}
  .event-badge.lifecycle{background:rgba(251,191,36,.14);color:var(--amber)}
  .event-time{color:var(--dim);font-size:10px;white-space:nowrap}

  .actions{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:16px;border-top:1px solid var(--line)}
  .actions-right{display:flex;align-items:center;gap:10px;margin-left:auto}
  .btn{font:inherit;font-size:13px;font-weight:500;border-radius:10px;padding:9px 24px;cursor:pointer;transition:opacity .2s,transform .15s,background .2s;letter-spacing:.2px}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .btn-save{background:linear-gradient(135deg,var(--accent),var(--accent-3));color:#fff;border:none;box-shadow:0 6px 20px rgba(124,58,237,.28)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn-ghost:hover{background:#1a1a1e;color:var(--text)}
  .toast{font-size:12px;padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .25s}
  .toast.show{opacity:1}
  .toast.ok{color:var(--green);background:rgba(34,197,94,.09);border:1px solid rgba(34,197,94,.2)}
  .toast.err{color:var(--red);background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.2)}

  @media (max-width:820px){
    .grid{grid-template-columns:1fr}
    .stat-row{grid-template-columns:repeat(2,1fr)}
    .param{grid-template-columns:1fr;gap:6px}
    input[type=range],select{width:100%}
    .ctrl{width:100%}
    .actions{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Meroño TTS</h1>
      <p>Render · Fish Audio · ajustes en caliente</p>
    </div>
    <div class="status-pill" id="status-pill">
      <span class="dot" id="status-dot"></span>
      <span id="status-label">Conectando…</span>
      <strong id="status-model"></strong>
    </div>
  </header>

  <div class="grid">
    <div class="card full">
      <div class="card-header"><span class="icon">◈</span><h2>Modelo y audio</h2></div>
      <div class="param">
        <label>Modelo <span class="tag">Fish Audio</span></label>
        <div class="ctrl"><select id="model"></select></div>
      </div>
      <div class="param">
        <label>Formato</label>
        <div class="ctrl"><select id="format"><option value="mp3">MP3</option><option value="wav">WAV</option><option value="pcm">PCM</option><option value="opus">Opus</option></select></div>
      </div>
      <div class="param">
        <label>Frecuencia de muestreo</label>
        <div class="ctrl"><select id="sample_rate"><option value="8000">8 kHz</option><option value="16000">16 kHz</option><option value="22050">22.05 kHz</option><option value="24000">24 kHz</option><option value="32000">32 kHz</option><option value="44100">44.1 kHz</option><option value="48000">48 kHz</option></select></div>
      </div>
      <div class="param">
        <label>Tasa de bits MP3 <span class="tag">kbps</span></label>
        <div class="ctrl"><select id="mp3_bitrate"><option value="64">64</option><option value="128">128</option><option value="192">192</option></select></div>
      </div>
      <div class="param">
        <label>Latencia</label>
        <div class="ctrl"><select id="latency"><option value="normal">Normal · mejor calidad</option><option value="balanced">Equilibrada</option><option value="low">Baja · más rápida</option></select></div>
      </div>
      <div class="model-hint" id="model-hint"></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="icon">◔</span><h2>Prosodia</h2></div>
      <div class="param"><label>Velocidad</label><div class="ctrl"><input type="range" id="prosody_speed" min="0.5" max="2" step="0.05"><span class="val" id="prosody_speed-v">1.20</span></div></div>
      <div class="param"><label>Volumen <span class="tag">dB</span></label><div class="ctrl"><input type="range" id="prosody_volume" min="-20" max="20" step="1"><span class="val" id="prosody_volume-v">5</span></div></div>
      <div class="param"><label>Normalizar sonoridad</label><label class="toggle"><input type="checkbox" id="prosody_normalize_loudness"><span class="slider"></span></label></div>
    </div>

    <div class="card">
      <div class="card-header"><span class="icon">✦</span><h2>Muestreo</h2></div>
      <div class="param"><label>Temperatura</label><div class="ctrl"><input type="range" id="temperature" min="0" max="1" step="0.05"><span class="val" id="temperature-v">0.65</span></div></div>
      <div class="param"><label>Top P</label><div class="ctrl"><input type="range" id="top_p" min="0" max="1" step="0.05"><span class="val" id="top_p-v">0.65</span></div></div>
      <div class="param"><label>Penalización de repetición</label><div class="ctrl"><input type="range" id="repetition_penalty" min="1" max="2" step="0.05"><span class="val" id="repetition_penalty-v">1.25</span></div></div>
      <div class="param"><label>Umbral de parada temprana</label><div class="ctrl"><input type="range" id="early_stop_threshold" min="0" max="1" step="0.05"><span class="val" id="early_stop_threshold-v">1.00</span></div></div>
    </div>

    <div class="card full">
      <div class="card-header"><span class="icon">⚙</span><h2>Procesamiento</h2></div>
      <div class="param"><label>Longitud de fragmento</label><div class="ctrl"><input type="range" id="chunk_length" min="100" max="300" step="10"><span class="val" id="chunk_length-v">240</span></div></div>
      <div class="param"><label>Longitud mín. de fragmento</label><div class="ctrl"><input type="range" id="min_chunk_length" min="0" max="100" step="5"><span class="val" id="min_chunk_length-v">80</span></div></div>
      <div class="param"><label>Máx. tokens nuevos</label><div class="ctrl"><input type="range" id="max_new_tokens" min="256" max="2048" step="128"><span class="val" id="max_new_tokens-v">1024</span></div></div>
      <div class="param"><label>Normalizar texto</label><label class="toggle"><input type="checkbox" id="normalize"><span class="slider"></span></label></div>
      <div class="param"><label>Condicionar en fragmento anterior</label><label class="toggle"><input type="checkbox" id="condition_on_previous_chunks"><span class="slider"></span></label></div>
    </div>

    <div class="card full">
      <div class="card-header"><span class="icon">◉</span><h2>Monitor</h2></div>
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="stat-model">-</div><div class="lbl">Modelo</div></div>
        <div class="stat-box"><div class="num" id="stat-cache">-</div><div class="lbl">Caché</div></div>
        <div class="stat-box"><div class="num" id="stat-messages">-</div><div class="lbl">Mensajes</div></div>
        <div class="stat-box"><div class="num" id="stat-hits">-</div><div class="lbl">Cache hits</div></div>
        <div class="stat-box"><div class="num" id="stat-uptime">-</div><div class="lbl">Activo</div></div>
      </div>
      <div class="table-wrap">
        <table class="event-table">
          <thead><tr><th>Tipo</th><th>Usuario</th><th>Texto / estado</th><th>Hora</th></tr></thead>
          <tbody id="events-body"><tr><td colspan="4" style="color:#5c5c66;padding:8px">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="actions">
    <div class="toast" id="toast"></div>
    <div class="actions-right">
      <button class="btn btn-ghost" id="reset-btn">Restaurar</button>
      <button class="btn btn-save" id="save-btn">Guardar ajustes</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SLIDERS = ['prosody_speed','prosody_volume','temperature','top_p','repetition_penalty','early_stop_threshold','chunk_length','min_chunk_length','max_new_tokens'];
const SELECTS = ['format','sample_rate','mp3_bitrate','latency'];
const CHECKS = ['prosody_normalize_loudness','normalize','condition_on_previous_chunks'];
const MODEL_INFO = {
  's2.1-pro-free': {label:'S2.1 Pro Free', note:'Mismo modelo que producción, gratis con límites de uso justo.'},
  's2.1-pro': {label:'S2.1 Pro', note:'Producción sin límites de fair-use. Se factura por uso.'},
  's2-pro': {label:'S2 Pro', note:'Generación anterior de la familia S2.'},
  'drama-3': {label:'Drama 3 · nuevo', note:'Direcciones de interpretación: <code>[susurrando]</code>, <code>[risa]</code>, <code>[pausa]</code> y énfasis con <code>&lt;emphasis&gt;…&lt;/emphasis&gt;</code>. Se factura por uso.'}
};
let settings = null;
let dirty = false;
let adminToken = readToken();

function readToken() {
  const params = new URLSearchParams(location.search);
  const urlToken = params.get('token');
  if (urlToken) {
    sessionStorage.setItem('merono_admin_token', urlToken);
    history.replaceState({}, '', location.pathname);
    return urlToken;
  }
  return sessionStorage.getItem('merono_admin_token') || '';
}

function markDirty() { dirty = true; }

SLIDERS.forEach(id => {
  $(id).addEventListener('input', () => {
    $(id + '-v').textContent = formatValue(id, $(id).value);
    markDirty();
  });
});
SELECTS.forEach(id => $(id).addEventListener('change', markDirty));
CHECKS.forEach(id => $(id).addEventListener('change', markDirty));
$('model').addEventListener('change', () => { renderModelHint(); markDirty(); });

function formatValue(id, value) {
  const step = parseFloat($(id).step || '1');
  return step >= 1 ? String(Math.round(Number(value))) : Number(value).toFixed(2);
}

function renderModelHint() {
  const info = MODEL_INFO[$('model').value];
  const hint = $('model-hint');
  if (!$('model').value.includes('drama')) {
    hint.classList.remove('show');
    hint.innerHTML = '';
    return;
  }
  hint.innerHTML = info ? info.note : '';
  hint.classList.add('show');
}

function fillModelOptions(models) {
  const select = $('model');
  select.innerHTML = models.map(model => {
    const info = MODEL_INFO[model];
    return '<option value="' + escapeHtml(model) + '">' + escapeHtml(info ? info.label : model) + '</option>';
  }).join('');
}

function populate(payload) {
  settings = payload.settings;
  fillModelOptions(payload.models || []);
  $('model').value = settings.model;
  SLIDERS.forEach(id => {
    $(id).value = settings[id];
    $(id + '-v').textContent = formatValue(id, settings[id]);
  });
  SELECTS.forEach(id => { $(id).value = settings[id]; });
  CHECKS.forEach(id => { $(id).checked = Boolean(settings[id]); });
  renderModelHint();
  dirty = false;
}

function collect() {
  const body = { model: $('model').value };
  SLIDERS.forEach(id => { body[id] = parseFloat($(id).value); });
  SELECTS.forEach(id => { body[id] = id === 'format' || id === 'latency' ? $(id).value : parseInt($(id).value, 10); });
  CHECKS.forEach(id => { body[id] = $(id).checked; });
  return body;
}

async function api(path, options = {}) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let detail = 'HTTP ' + response.status;
    try { const body = await response.json(); detail = body.detail || detail; } catch {}
    const error = new Error(detail);
    error.status = response.status;
    throw error;
  }
  return response.json();
}

async function load() {
  try {
    const payload = await api('/api/settings');
    populate(payload);
  } catch (error) {
    setStatus(false, 'Desconectado');
    toast('Error de conexión: ' + error.message, 'err');
  }
  loadHealth();
  loadMonitor();
}

function setStatus(ok, text, model) {
  $('status-dot').className = 'dot ' + (ok ? 'green pulse' : 'red');
  $('status-label').textContent = text;
  $('status-model').textContent = model ? '· ' + model : '';
}

async function loadHealth() {
  try {
    const health = await api('/health');
    const ok = Boolean(health.fish_configured && health.widget_configured);
    setStatus(ok, ok ? 'Conectado' : 'Sin configurar', health.model);
    if (!settings && health.model) $('status-model').textContent = '· ' + health.model;
  } catch {
    setStatus(false, 'Desconectado');
  }
}

async function postSettings(path, body) {
  const headers = { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken };
  try {
    return await api(path, { method: 'POST', headers, body: JSON.stringify(body || {}) });
  } catch (error) {
    if (error.status !== 401) throw error;
    const token = prompt('Token de administrador:') || '';
    if (!token) throw new Error('Cancelado');
    adminToken = token;
    sessionStorage.setItem('merono_admin_token', adminToken);
    headers['X-Admin-Token'] = adminToken;
    return await api(path, { method: 'POST', headers, body: JSON.stringify(body || {}) });
  }
}

async function save() {
  const button = $('save-btn');
  button.disabled = true;
  try {
    const payload = await postSettings('/api/settings', collect());
    populate(payload);
    toast('Ajustes guardados', 'ok');
    loadHealth();
    loadMonitor();
  } catch (error) {
    toast('Error: ' + error.message, 'err');
  } finally {
    button.disabled = false;
  }
}

async function reset() {
  if (!confirm('¿Restaurar todos los ajustes por defecto?')) return;
  const button = $('reset-btn');
  button.disabled = true;
  try {
    const payload = await postSettings('/api/settings/reset', {});
    populate(payload);
    toast('Ajustes restaurados', 'ok');
    loadHealth();
    loadMonitor();
  } catch (error) {
    toast('Error: ' + error.message, 'err');
  } finally {
    button.disabled = false;
  }
}

async function loadMonitor() {
  try {
    const stats = await api('/api/stats');
    $('stat-model').textContent = stats.model || '-';
    $('stat-cache').textContent = stats.cache.size + '/' + stats.cache.max_size;
    $('stat-messages').textContent = stats.counts.speech || 0;
    $('stat-hits').textContent = stats.counts.cache_hit || 0;
    $('stat-uptime').textContent = formatUptime(stats.uptime_seconds);
  } catch {}
  try {
    const events = await api('/api/events?limit=8');
    const body = $('events-body');
    if (!events.length) {
      body.innerHTML = '<tr><td colspan="4" style="color:#5c5c66;padding:8px">Sin eventos</td></tr>';
      return;
    }
    body.innerHTML = events.slice().reverse().map(event => {
      const type = event.event_type || 'speech';
      const data = event.data || {};
      let detail = data.text || data.state || (data.status ? 'HTTP ' + data.status : '');
      if (data.cache) detail += ' · ' + data.cache;
      return '<tr><td><span class="event-badge ' + escapeHtml(type) + '">' + escapeHtml(type.replace('_', ' ')) + '</span></td>' +
        '<td>' + escapeHtml(data.username || '-') + '</td>' +
        '<td>' + escapeHtml(detail) + '</td>' +
        '<td class="event-time">' + escapeHtml((event.iso_time || '').slice(11, 19)) + '</td></tr>';
    }).join('');
  } catch {}
}

function formatUptime(seconds) {
  seconds = Number(seconds) || 0;
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  if (days) return days + 'd ' + hours + 'h';
  if (hours) return hours + 'h ' + minutes + 'm';
  return minutes + 'm';
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[character]));
}

function toast(message, type) {
  const element = $('toast');
  element.textContent = message;
  element.className = 'toast ' + type + ' show';
  clearTimeout(element._timer);
  element._timer = setTimeout(() => { element.className = 'toast'; }, 2800);
}

$('save-btn').addEventListener('click', save);
$('reset-btn').addEventListener('click', reset);
window.addEventListener('beforeunload', event => {
  if (!dirty) return;
  event.preventDefault();
  event.returnValue = '';
});

load();
setInterval(loadHealth, 15000);
setInterval(loadMonitor, 10000);
</script>
