services:
  - type: web
    name: merono-tts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FISH_API_KEY
        sync: false
      - key: FISH_VOICE_ID
        sync: false
      - key: WIDGET_TOKEN
        sync: false
      - key: FISH_MODEL
        value: s2.1-pro-free
      - key: ALLOWED_CHANNEL
        value: alimentacionchino
      - key: MIN_BITS
        value: 10
      - key: CORS_ORIGINS
        value: https://streamelements.com,https://www.streamelements.com
      - key: PUBLIC_BASE_URL
        sync: false
