services:
  - type: web
    name: merono-tts
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FISH_API_KEY
        sync: false
      - key: FISH_VOICE_ID
        sync: false
      - key: FISH_MODEL
        value: s2.1-pro-free
      # Opcional: fija la URL pública si no quieres que se deduzca sola.
      # - key: PUBLIC_BASE_URL
      #   value: https://merono-tts.onrender.com
